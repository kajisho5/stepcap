name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: OCR engine for build/ocr.py (Windows and macOS have one built in)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-jpn
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,mcp]"
      - name: Unit tests (no real input hooks are used in CI)
        run: python -m pytest -q -rs
      - name: End-to-end smoke test (simulate -> build -> export)
        shell: bash
        run: |
          python tests/fixtures/make_events.py > ev.json
          stepcap simulate ev.json -o demo
          stepcap build demo
          test -f demo/guide.md && test -f demo/guide.html && test -f demo/steps.json
          test -f demo/checklist.html
          stepcap build demo --json > build2.json
          python -c "import json;r=json.load(open('build2.json'));assert r['written']==[],r"
          stepcap export demo --format both -o dist --name demo-skill
          test -f dist/guide/guide.html && test -f dist/skill/demo-skill/SKILL.md
          stepcap check-skill dist/skill/demo-skill
      - name: doctor runs (result depends on the runner's desktop session)
        shell: bash
        run: stepcap doctor --json > doctor.json || true; python -c "import json;json.load(open('doctor.json'))"

  video:
    # stepcap video against the real engine: ffmpeg-skill main (read-only checkout), ffmpeg and
    # tesseract (Japanese) from apt. Fails when the integration test is skipped.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: kajisho5/ffmpeg-skill
          ref: main
          path: ffmpeg-skill
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: ffmpeg and OCR (to read the Japanese caption back)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-jpn
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Video tests run (not skipped)
        env:
          FFMPEG_SKILL_DIR: ${{ github.workspace }}/ffmpeg-skill
        run: |
          set -o pipefail
          python -m pytest tests/test_video.py -rs -v 2>&1 | tee video.log
          ! grep -q "SKIPPED" video.log
      - name: End-to-end (simulate -> video, then ffmpeg-skill check on the file)
        env:
          FFMPEG_SKILL_DIR: ${{ github.workspace }}/ffmpeg-skill
        run: |
          python tests/fixtures/make_events.py > ev.json
          stepcap simulate ev.json -o demo
          stepcap video demo --lang ja --fast --json > video.json
          python -c "import json;r=json.load(open('video.json'));assert r['ok'],r['check']"
          python ffmpeg-skill/scripts/check.py demo/guide.mp4 --platform youtube
          stepcap doctor --json > doctor.json || true
          python -c "import json;c={x['id']:x for x in json.load(open('doctor.json'))['checks']};assert c['video']['status']=='ok',c['video']"
